<rect x="55" y="220" width="180" height="42" class="current"/><text x="145" y="246" text-anchor="middle" class="label">Gateway</text><rect x="55" y="278" width="180" height="42" class="current"/><text x="145" y="304" text-anchor="middle" class="label">Orders</text><rect x="55" y="336" width="180" height="30" class="current"/><text x="145" y="356" text-anchor="middle" class="small">Inventory</text>
