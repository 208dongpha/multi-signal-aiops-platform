<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
<title id="title">Multi-Signal AIOps target architecture</title><desc id="desc">Proposed AIOps architecture connecting OpenTelemetry services and Collector to Kafka, Flink, signal stores, an Iceberg lakehouse, incident API, and Grafana. Current and proposed components are distinguished.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker><style>.title{font:700 25px Arial;fill:#172033}.sub{font:14px Arial;fill:#64748b}.label{font:700 15px Arial;fill:#172033}.small{font:12px Arial;fill:#475569}.tiny{font:11px Arial;fill:#64748b}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:10}.current{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.target{fill:#fff;stroke:#a855f7;stroke-width:2;stroke-dasharray:7 5;rx:10}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge2{stroke:#64748b;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.badge{font:700 10px Arial;letter-spacing:.4px}</style></defs>
<rect width="1360" height="760" fill="#f8fafc"/><text x="42" y="48" class="title">Multi-Signal AIOps Platform</text><text x="42" y="74" class="sub">Proposed target architecture · synthetic telemetry · evidence-linked investigation</text>
<rect x="1000" y="28" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="1022" y="40" class="small">Current (Phase 0–1)</text><rect x="1172" y="28" width="14" height="14" rx="3" fill="#faf5ff" stroke="#a855f7" stroke-dasharray="4 3"/><text x="1194" y="40" class="small">Target (proposed)</text>
