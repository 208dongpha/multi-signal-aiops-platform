<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc">
<title id="title">AIOps incident observability dashboard mockup</title><desc id="desc">Illustrative dashboard with synthetic telemetry counters, latency time series, signal correlation heatmap, and an incident evidence list.</desc>
<defs><style>.h{font:700 21px Arial;fill:#263238}.nav{font:14px Arial;fill:#334155}.section{font:700 17px Arial;fill:#334155}.metric{font:700 43px Arial;fill:#202a35}.muted{font:13px Arial;fill:#758397}.caption{font:12px Arial;fill:#64748b}.table{font:13px Arial;fill:#334155}.panel{fill:#fff;stroke:#d7dce2;stroke-width:1;rx:8}.grid{stroke:#e9edf2;stroke-width:1}.blue{fill:#1098d1}.green{fill:#1fa971}.orange{fill:#e4932e}.red{fill:#d9534f}</style></defs>
<rect width="1280" height="830" fill="#f1f3f5"/><rect x="0" y="0" width="1280" height="58" fill="#fff"/><text x="26" y="37" class="h">Multi-Signal AIOps</text><rect x="833" y="14" width="92" height="32" rx="5" fill="#0c9bd1"/><text x="879" y="35" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Overview</text><text x="947" y="35" class="nav">Incidents</text><text x="1030" y="35" class="nav">Services</text><text x="1114" y="35" class="nav">Explore</text><text x="1200" y="35" class="nav">Settings</text>
<rect x="16" y="72" width="1248" height="34" fill="#fff" stroke="#d7dce2" rx="6"/><text x="30" y="95" class="section">Service Health</text><text x="1082" y="95" class="caption">Window: last 30 minutes · synthetic demo data</text>
<!-- KPI tiles -->
<rect x="16" y="118" width="300" height="126" class="panel"/><text x="36" y="146" class="muted">REQUEST RATE</text><text x="36" y="198" class="metric">128</text><text x="130" y="197" class="muted">req/s</text><text x="36" y="224" class="caption">Across 3 demo services</text>
<rect x="330" y="118" width="300" height="126" class="panel"/><text x="350" y="146" class="muted">ERROR RATE</text><text x="350" y="198" class="metric" fill="#d9534f">2.4%</text><text x="350" y="224" class="caption">Elevated · synthetic scenario</text>
<rect x="644" y="118" width="300" height="126" class="panel"/><text x="664" y="146" class="muted">P95 LATENCY</text><text x="664" y="198" class="metric">840</text><text x="767" y="197" class="muted">ms</text><text x="664" y="224" class="caption">Gateway · last 5 min</text>
<rect x="958" y="118" width="306" height="126" class="panel"/><text x="978" y="146" class="muted">OPEN INCIDENTS</text><text x="978" y="198" class="metric">1</text><rect x="1023" y="173" width="87" height="27" rx="13" fill="#fff0e5"/><text x="1066" y="191" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#b55e14">INVESTIGATE</text><text x="978" y="224" class="caption">Correlated evidence available</text>
<!-- charts -->
<rect x="16" y="258" width="790" height="270" class="panel"/><text x="36" y="289" class="section">Request latency &amp; errors</text><text x="36" y="311" class="caption">p95 latency (ms) · error rate (%)</text>
<line x1="74" y1="350" x2="774" y2="350" class="grid"/><line x1="74" y1="395" x2="774" y2="395" class="grid"/><line x1="74" y1="440" x2="774" y2="440" class="grid"/><line x1="74" y1="485" x2="774" y2="485" class="grid"/><text x="35" y="354" class="caption">1000</text><text x="46" y="399" class="caption">750</text><text x="46" y="444" class="caption">500</text><text x="46" y="489" class="caption">250</text>
<polyline points="78,458 130,451 182,455 234,442 286,448 338,436 390,440 442,425 494,432 546,414 598,402 650,385 702,392 754,360" fill="none" stroke="#159bd3" stroke-width="3"/><polyline points="78,490 130,488 182,490 234,487 286,488 338,486 390,487 442,485 494,486 546,483 598,482 650,473 702,466 754,450" fill="none" stroke="#df6b55" stroke-width="2.5"/><line x1="640" y1="332" x2="640" y2="492" stroke="#d9534f" stroke-dasharray="5 4"/><text x="650" y="343" class="caption" fill="#b33">anomaly</text><text x="76" y="512" class="caption">14:00</text><text x="290" y="512" class="caption">14:10</text><text x="505" y="512" class="caption">14:20</text><text x="716" y="512" class="caption">14:30</text><circle cx="533" cy="290" r="5" fill="#159bd3"/><text x="544" y="295" class="caption">p95 latency</text><circle cx="651" cy="290" r="5" fill="#df6b55"/><text x="662" y="295" class="caption">error rate</text>
<rect x="820" y="258" width="444" height="270" class="panel"/><text x="840" y="289" class="section">Signal correlation</text><text x="840" y="311" class="caption">Evidence aligned by service and time window</text><text x="1012" y="343" class="caption">Logs</text><text x="1084" y="343" class="caption">Metrics</text><text x="1166" y="343" class="caption">Traces</text>
<text x="840" y="379" class="table">gateway</text><text x="840" y="423" class="table">orders</text><text x="840" y="467" class="table">inventory</text>
<rect x="1006" y="355" width="62" height="34" rx="4" fill="#72c7de"/><rect x="1076" y="355" width="70" height="34" rx="4" fill="#eda45a"/><rect x="1154" y="355" width="70" height="34" rx="4" fill="#78c99b"/><rect x="1006" y="399" width="62" height="34" rx="4" fill="#54b8d7"/><rect x="1076" y="399" width="70" height="34" rx="4" fill="#e68a51"/><rect x="1154" y="399" width="70" height="34" rx="4" fill="#56bd83"/><rect x="1006" y="443" width="62" height="34" rx="4" fill="#b6e0eb"/><rect x="1076" y="443" width="70" height="34" rx="4" fill="#f3d5a1"/><rect x="1154" y="443" width="70" height="34" rx="4" fill="#b9e5c9"/><text x="840" y="505" class="caption">Visual association only — not causal proof.</text>
<!-- incident table -->
<rect x="16" y="542" width="1248" height="268" class="panel"/><text x="36" y="574" class="section">Recent incidents &amp; evidence</text><rect x="28" y="591" width="1224" height="34" fill="#f6f8fa"/><text x="40" y="613" class="muted">TIME</text><text x="180" y="613" class="muted">SIGNAL / SERVICE</text><text x="450" y="613" class="muted">OBSERVATION</text><text x="930" y="613" class="muted">TRACE / EVIDENCE</text><text x="1140" y="613" class="muted">STATUS</text>
<line x1="28" y1="667" x2="1252" y2="667" class="grid"/><line x1="28" y1="710" x2="1252" y2="710" class="grid"/>
<text x="40" y="651" class="table">14:27:18</text><text x="180" y="651" class="table">gateway · latency</text><text x="450" y="651" class="table">p95 rose to 840 ms after error burst</text><text x="930" y="651" class="table" fill="#0784b4">trace 7f3a… · 3 logs</text><rect x="1140" y="633" width="92" height="24" rx="12" fill="#fff0e5"/><text x="1186" y="650" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#b55e14">INVESTIGATE</text>
<text x="40" y="694" class="table">14:26:52</text><text x="180" y="694" class="table">orders · HTTP 5xx</text><text x="450" y="694" class="table">Retry scenario detected in synthetic workload</text><text x="930" y="694" class="table" fill="#0784b4">trace 7f3a… · 2 logs</text><rect x="1140" y="676" width="92" height="24" rx="12" fill="#e8f4fb"/><text x="1186" y="693" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#0879a6">CORRELATED</text>
<text x="40" y="737" class="table">14:25:31</text><text x="180" y="737" class="table">inventory · dependency</text><text x="450" y="737" class="table">Timeouts overlap with downstream request failures</text><text x="930" y="737" class="table" fill="#0784b4">trace 7f3a… · 1 log</text><rect x="1140" y="719" width="92" height="24" rx="12" fill="#edf7f0"/><text x="1186" y="736" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#27834e">OBSERVED</text>
<text x="36" y="785" class="caption">Illustrative dashboard mockup · synthetic values only · correlation ranks evidence and does not establish root cause.</text>
